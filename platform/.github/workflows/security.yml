name: security
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
permissions:
  contents: read
jobs:
  security:
    permissions:
      contents: read
      pull-requests: write
      security-events: write
      actions: read
    uses: mrahamangm-droid/saas-platform-kit/.github/workflows/reusable-security.yml@v1
    with:
      run-codeql: false # private repo without GitHub Advanced Security; set true if enabled or repo is public
      fail-on-severity: high
